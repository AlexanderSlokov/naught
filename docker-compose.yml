# If the API fails to start due to a missing lake or database error,
# run: `docker compose run --rm api node apps/api/dist/lake/migrate-lake.js`
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NAUGHT_DATA_DIR: /var/lib/naught
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NAUGHT_API_PORT: "3001"
      # Allowed frontend origin for CORS and WebSocket connections.
      # Set to an explicit origin instead of '*' so only your frontend can trigger runs.
      NAUGHT_WEB_ORIGIN: ${NAUGHT_WEB_ORIGIN:-http://localhost:3000}
    env_file:
      - path: .env
        required: false
    volumes:
      - naught-data:/var/lib/naught
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Public API URL used by the browser (client-side).
        # The browser cannot access Docker's internal 'http://api:3001', so it needs
        # an externally reachable URL. Baked in at build time; rebuild if changed.
        NEXT_PUBLIC_NAUGHT_API_URL: ${NEXT_PUBLIC_NAUGHT_API_URL:-http://localhost:3001}
    environment:
      NAUGHT_API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # Redis is only used as an in-memory job queue, not for persistent data.
    # Persistence is disabled for speed; if lost, collection runs will simply re-run.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  # Persistent volume for application data (mounted at /var/lib/naught).
  # To back up, copy this volume. The 'runs/' folder contains the actual data,
  # while 'naught.duckdb' is just a cache that can be recreated.
  naught-data:
